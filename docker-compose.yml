# Local dev/self-hosted stack: app + Postgres (single stateful dependency —
# see design.md "Technical Approach"). pg-boss creates its own `pgboss`
# schema in the same database on boot; no separate queue service needed.
services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-dforce}:${POSTGRES_PASSWORD:-dforce}@db:5432/${POSTGRES_DB:-dforce_catalog}
      IFX_TOKEN: ${IFX_TOKEN:-}
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  # Runs migrations against the `builder` stage, which still has drizzle-kit,
  # drizzle.config.ts, and the full source (the production `app` image is
  # intentionally stripped down to .next/standalone and doesn't have any of
  # that — see Dockerfile). Not started by `docker compose up`; invoke with
  # `docker compose run --rm migrate`.
  migrate:
    build:
      context: .
      target: builder
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-dforce}:${POSTGRES_PASSWORD:-dforce}@db:5432/${POSTGRES_DB:-dforce_catalog}
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]
    command: ["node", "scripts/migrate.mjs"]

  db:
    image: postgres:17-alpine
    # Published so host-side `npm run dev` / `npm run db:migrate` can reach it —
    # without this the documented DATABASE_URL only ever resolved for the
    # in-network `app`/`migrate` services. 5433, not 5432: a Homebrew Postgres
    # commonly holds 5432 on a dev machine and the clash is silent until the
    # first query hits the wrong database.
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dforce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dforce}
      POSTGRES_DB: ${POSTGRES_DB:-dforce_catalog}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dforce} -d ${POSTGRES_DB:-dforce_catalog}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db-data:
